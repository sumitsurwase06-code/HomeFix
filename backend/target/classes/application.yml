spring:
  datasource:
    url: jdbc:mysql://localhost:3306/homefix_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:homefix}
    password: ${DB_PASSWORD:homefix123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

server:
  port: 8080

app:
  upload:
    dir: ${UPLOAD_DIR:./uploads}

jwt:
  secret: ${JWT_SECRET:change-me-in-production}
  expirationMs: 86400000
